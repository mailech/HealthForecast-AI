services:

  mysql:
    image: mysql:8.0
    container_name: healthcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: final_healthcare
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/final_healthcare.sql:/docker-entrypoint-initdb.d/final_healthcare.sql

  backend:
    build:
      context: ./backend
    container_name: healthcare-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: final_healthcare
      DB_PORT: 3306
      JWT_SECRET: final_healthcare_secret_key
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: healthcare-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql_data: