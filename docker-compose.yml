services:
  # ============================================================================
  # Backend Service (FastAPI + ML + SQLite)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthforecast-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "HealthForecast AI"
      VERSION: "1.0.0"
      API_V1_STR: "/api"
      SECRET_KEY: "healthforecast_docker_secure_secret_key_change_in_prod"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      DATABASE_URL: "sqlite:////app/data/healthforecast.db"
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173","http://localhost:80","http://localhost"]'
      SEED_DEMO_DATA: "true"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - healthforecast-network

  # ============================================================================
  # Frontend Service (React SPA served by Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: healthforecast-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - healthforecast-network

volumes:
  backend-data:
    driver: local

networks:
  healthforecast-network:
    driver: bridge
