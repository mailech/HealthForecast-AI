version: '3.8'

services:
  # Frontend Web Client (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - healthforecast-net
    restart: always

  # Node.js Express Backend & WebSockets API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://localhost:27017/healthforecast}
      - MONGO_URI=${MONGO_URI:-mongodb://localhost:27017/healthforecast}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://ml_service:8000}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - ml_service
    networks:
      - healthforecast-net
    restart: always

  # Python FastAPI ML Predictive Microservice
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - healthforecast-net
    restart: always

networks:
  healthforecast-net:
    driver: bridge
