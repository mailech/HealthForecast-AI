# ==============================================================================
# HealthForecast AI - Development Docker Compose Setup (with live reload)
# Usage: docker compose -f docker-compose.dev.yml up --build
# ==============================================================================

services:
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthforecast-backend-dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=HealthForecast AI (Dev)
      - VERSION=1.0.0
      - API_V1_STR=/api
      - SECRET_KEY=dev_secret_key_1234567890
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - DATABASE_URL=sqlite:////app/data/healthforecast.db
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000","http://127.0.0.1:3000"]
      - SEED_DEMO_DATA=True
    volumes:
      - ./backend/app:/app/app
      - backend-dev-data:/app/data
    networks:
      - healthforecast-dev-net

  frontend-dev:
    image: node:20-alpine
    container_name: healthforecast-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    depends_on:
      - backend-dev
    networks:
      - healthforecast-dev-net

volumes:
  backend-dev-data:

networks:
  healthforecast-dev-net:
    driver: bridge
