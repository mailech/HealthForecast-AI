server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check for frontend container
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"Healthy","service":"HealthForecast AI Frontend"}';
    }
}