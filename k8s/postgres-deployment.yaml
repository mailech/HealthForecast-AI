apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: healthforecast
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: healthadmin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: healthforecast-secrets
                  key: db-password
            - name: POSTGRES_DB
              value: healthforecast_ai
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: healthforecast
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
